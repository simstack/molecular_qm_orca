[project]
name = "molecular_qm_orca"
version = "0.1.0"
description = "ORCA wrapper"
requires-python = ">=3.12"
dependencies = [
    "molecular_qm_models",
]

[tool.uv.sources]
molecular_qm_models = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat repo layout: modules live at the repo root, but must install as
# molecular_qm_orca.* (nested package name).
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "molecular_qm_orca/__init__.py"
"orca.py" = "molecular_qm_orca/orca.py"
"orca_input.py" = "molecular_qm_orca/orca_input.py"
"orca_output.py" = "molecular_qm_orca/orca_output.py"
"lib" = "molecular_qm_orca/lib"

[project.entry-points."simstack.modules"]
molecular_qm_orca = "molecular_qm_orca"
